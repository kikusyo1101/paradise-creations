<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>じゃんけん — 対コンピュータ</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171c26;
    --panel2: #1e2532;
    --text: #e6ebf2;
    --muted: #8a94a6;
    --border: #2a3140;
    --win: #2ecc71;
    --lose: #e74c3c;
    --draw: #95a5a6;
    --accent: var(--draw);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #182030 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .app { width: 100%; max-width: 640px; }
  h1 {
    text-align: center;
    font-size: 26px;
    letter-spacing: 0.04em;
    margin: 0 0 4px;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 24px; }

  /* 手の選択ボタン */
  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .choice-btn {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    padding: 22px 8px 16px;
    cursor: pointer;
    transition: transform .08s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .choice-btn:hover { border-color: #46506a; transform: translateY(-2px); }
  .choice-btn:active { transform: translateY(0); }
  .choice-btn .emoji { font-size: 44px; line-height: 1; }
  .choice-btn .label { font-size: 15px; font-weight: 600; }
  .choice-btn .key { font-size: 11px; color: var(--muted); }
  .choice-btn.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.35);
    background: var(--panel2);
  }

  /* 対戦表示 */
  .arena {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 18px;
    margin-bottom: 20px;
  }
  .hands {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }
  .hand { text-align: center; }
  .hand .who { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .hand .emoji {
    font-size: 60px; line-height: 1;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 0;
  }
  .hand .name { margin-top: 8px; font-size: 14px; color: var(--text); }
  .vs { font-size: 18px; font-weight: 700; color: var(--muted); }

  .result {
    text-align: center;
    margin-top: 18px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--accent);
    min-height: 42px;
  }
  .result.idle { color: var(--muted); font-size: 18px; font-weight: 600; letter-spacing: 0.04em; }

  /* スコアボード */
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .score-cell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
  }
  .score-cell .num { font-size: 30px; font-weight: 800; }
  .score-cell .cap { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: 0.06em; }
  .score-cell.wins .num { color: var(--win); }
  .score-cell.losses .num { color: var(--lose); }
  .score-cell.draws .num { color: var(--draw); }

  .actions { display: flex; justify-content: center; }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: border-color .15s ease, color .15s ease;
  }
  .reset-btn:hover { border-color: var(--lose); color: var(--lose); }

  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="app">
    <h1>じゃんけん</h1>
    <p class="subtitle">対コンピュータ ・ クリック / タップ / キーボード（R・P・S ／ 1・2・3）</p>

    <div class="choices" id="choices">
      <button class="choice-btn" data-choice="rock" aria-label="グー">
        <span class="emoji">✊</span><span class="label">グー</span><span class="key">R / 1</span>
      </button>
      <button class="choice-btn" data-choice="paper" aria-label="パー">
        <span class="emoji">✋</span><span class="label">パー</span><span class="key">P / 2</span>
      </button>
      <button class="choice-btn" data-choice="scissors" aria-label="チョキ">
        <span class="emoji">✌️</span><span class="label">チョキ</span><span class="key">S / 3</span>
      </button>
    </div>

    <div class="arena">
      <div class="hands">
        <div class="hand">
          <div class="who">あなた</div>
          <div class="emoji" id="playerEmoji">❔</div>
          <div class="name" id="playerName">—</div>
        </div>
        <div class="vs">VS</div>
        <div class="hand">
          <div class="who">コンピュータ</div>
          <div class="emoji" id="computerEmoji">❔</div>
          <div class="name" id="computerName">—</div>
        </div>
      </div>
      <div class="result idle" id="result">手を選んでスタート</div>
    </div>

    <div class="scoreboard">
      <div class="score-cell wins"><div class="num" id="scWins">0</div><div class="cap">WINS</div></div>
      <div class="score-cell losses"><div class="num" id="scLosses">0</div><div class="cap">LOSSES</div></div>
      <div class="score-cell draws"><div class="num" id="scDraws">0</div><div class="cap">DRAWS</div></div>
    </div>

    <div class="actions">
      <button class="reset-btn" id="resetBtn">スコアをリセット</button>
    </div>

    <p class="hint">もう一度手を選べば次のラウンドが始まり、スコアは累積されます。</p>
  </div>

  <script src="rps.js"></script>
  <script>
    (function () {
      'use strict';
      var game = createGame(); // 既定 rng = Math.random

      var EMOJI = { rock: '✊', paper: '✋', scissors: '✌️' };
      var JP = { rock: 'グー', paper: 'パー', scissors: 'チョキ' };
      var RESULT_TEXT = { win: 'WIN', lose: 'LOSE', draw: 'DRAW' };
      var RESULT_COLOR = { win: 'var(--win)', lose: 'var(--lose)', draw: 'var(--draw)' };

      var els = {
        buttons: Array.prototype.slice.call(document.querySelectorAll('.choice-btn')),
        playerEmoji: document.getElementById('playerEmoji'),
        playerName: document.getElementById('playerName'),
        computerEmoji: document.getElementById('computerEmoji'),
        computerName: document.getElementById('computerName'),
        result: document.getElementById('result'),
        scWins: document.getElementById('scWins'),
        scLosses: document.getElementById('scLosses'),
        scDraws: document.getElementById('scDraws'),
        resetBtn: document.getElementById('resetBtn'),
        root: document.documentElement
      };

      function renderScore() {
        els.scWins.textContent = game.score.wins;
        els.scLosses.textContent = game.score.losses;
        els.scDraws.textContent = game.score.draws;
      }

      function highlight(choice) {
        els.buttons.forEach(function (b) {
          b.classList.toggle('selected', b.getAttribute('data-choice') === choice);
        });
      }

      function playRound(choice) {
        var r = game.play(choice);

        els.playerEmoji.textContent = EMOJI[r.player];
        els.playerName.textContent = JP[r.player];
        els.computerEmoji.textContent = EMOJI[r.computer];
        els.computerName.textContent = JP[r.computer];

        els.result.textContent = RESULT_TEXT[r.result];
        els.result.classList.remove('idle');
        // 結果アクセント色を root に反映（選択ボタンのハイライト枠にも波及）
        els.root.style.setProperty('--accent', RESULT_COLOR[r.result]);
        els.result.style.color = RESULT_COLOR[r.result];

        highlight(r.player);
        renderScore();
      }

      // クリック / タップ
      els.buttons.forEach(function (b) {
        b.addEventListener('click', function () {
          playRound(b.getAttribute('data-choice'));
        });
      });

      // キーボード R/P/S・1/2/3
      var KEYMAP = {
        r: 'rock', '1': 'rock',
        p: 'paper', '2': 'paper',
        s: 'scissors', '3': 'scissors'
      };
      document.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase();
        if (KEYMAP[k]) { playRound(KEYMAP[k]); }
      });

      // リセット
      els.resetBtn.addEventListener('click', function () {
        game.reset();
        renderScore();
        els.playerEmoji.textContent = '❔';
        els.computerEmoji.textContent = '❔';
        els.playerName.textContent = '—';
        els.computerName.textContent = '—';
        els.result.textContent = '手を選んでスタート';
        els.result.classList.add('idle');
        els.result.style.color = '';
        els.root.style.setProperty('--accent', 'var(--draw)');
        highlight(null);
      });

      renderScore(); // 起動時に即プレイ可能（追加操作不要）
    })();
  </script>
</body>
</html>
